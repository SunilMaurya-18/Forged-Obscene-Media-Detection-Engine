name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn test)
    # Pin until GitHub's ubuntu-latest → 26 migration settles for torch/av wheels.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Includes the Testcontainers Redis test: two clients share one rate-limit bucket
      - run: mvn -B -ntp test
        working-directory: backend
      # Phase 28: the offline verifier (standard library only) against the package HandoverIntegrationTest issued
      - name: Offline evidence-package verifier
        run: |
          python3 tools/verify_evidence_package.py backend/target/phase28/package.zip \
            --keys backend/target/phase28/keys.json --sha256 "$(cat backend/target/phase28/package.sha256)"
          python3 -m unittest discover -v -s tools -p "test_*.py"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports

  ml-service:
    name: ml-service (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml-service/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: ml-service

  ml:
    name: ml (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider ml/tests
      # Phase 29: the shipped checkpoint + ensemble must be the ones measured, and must pass the robustness gate
      - name: Forgery-model release gate
        run: python ml/release_gate.py

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stack:
    name: Compose stack (smoke, Playwright, HA, image scan, SBOM)
    runs-on: ubuntu-24.04
    needs: [backend, ml-service, frontend]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          # Strong secrets required: compose defaults to APP_PROFILE=prod
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          MODERATOR_PASSWORD=$(openssl rand -hex 16)
          PROVENANCE_SIGNING_KEY=$(openssl rand -hex 32)
          INVESTIGATION_PSEUDONYM_KEY=$(openssl rand -hex 32)
          {
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "MODERATOR_USERNAME=ciadmin"
            echo "MODERATOR_PASSWORD=${MODERATOR_PASSWORD}"
            echo "MODERATOR_ROLE=ADMIN"
            echo "PROVENANCE_SIGNING_KEY=${PROVENANCE_SIGNING_KEY}"
            echo "INVESTIGATION_PSEUDONYM_KEY=${INVESTIGATION_PSEUDONYM_KEY}"
            echo "REPORT_SIGNING_ALLOW_FILE_KEYS=true"
            # Lower review band so the synthetic e2e pattern reliably routes to REVIEW
            echo "DECISION_FORGERY_REVIEW=0.05"
            echo "APP_PROFILE=prod"
          } > .env
          echo "E2E_MODERATOR_USERNAME=ciadmin" >> "$GITHUB_ENV"
          echo "E2E_MODERATOR_PASSWORD=${MODERATOR_PASSWORD}" >> "$GITHUB_ENV"
          docker compose build

      - name: Start the stack
        run: docker compose --profile tools up -d --wait --wait-timeout 600

      - name: Smoke test POST /api/analyze
        run: |
          # A synthetic pattern drawn inside the ml-service image (no real imagery)
          docker compose exec -T ml-service python -c "
          import sys; from PIL import Image
          im = Image.new('RGB', (224, 224))
          im.putdata([((x * 13 + y * 7) % 255, (x * 39 + y * 21) % 255, 255 - (x * 13 + y * 7) % 255) for y in range(224) for x in range(224)])
          im.save(sys.stdout.buffer, 'JPEG')" > sample.jpg
          code=$(curl -s -o analyze.json -w "%{http_code}" -H "X-Request-ID: ci-smoke" -F "file=@sample.jpg;type=image/jpeg" http://localhost:3000/api/analyze)
          cat analyze.json | head -c 400; echo
          test "$code" = "200"
          grep -q '"decision"' analyze.json
          docker compose logs ml-service | grep -q '"request_id": "ci-smoke"'

      - name: Metrics are exposed
        run: |
          docker compose exec -T backend curl -fsS http://localhost:8090/actuator/prometheus > backend-metrics.txt
          grep -q '^fmd_decisions_total{' backend-metrics.txt
          grep -q '^http_server_requests_seconds_bucket{' backend-metrics.txt
          docker compose exec -T ml-service python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/metrics').read().decode())" | grep -q '^fmd_ml_requests_total{'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright end-to-end flow
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"
          E2E_MODERATOR_USERNAME: ${{ env.E2E_MODERATOR_USERNAME }}
          E2E_MODERATOR_PASSWORD: ${{ env.E2E_MODERATOR_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Two backend instances share one rate limit (Redis)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d --wait --wait-timeout 300 backend-2
          # Mint a FREE-plan key (no bootstrap key in production posture)
          KEY=$(curl -fsS -u "${E2E_MODERATOR_USERNAME}:${E2E_MODERATOR_PASSWORD}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"ci-ha-$(date +%s)\",\"plan\":\"FREE\"}" \
            http://localhost:8081/api/admin/clients | python3 -c "import sys,json; print(json.load(sys.stdin)['apiKey'])")
          API_KEY="$KEY" sh ops/ha-ratelimit-check.sh

      - name: Backend refuses weak secrets
        run: |
          set +e
          docker compose run --rm --no-deps \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e MODERATOR_PASSWORD=moderator \
            -e SPRING_DATASOURCE_PASSWORD=forged \
            -e INVESTIGATION_PSEUDONYM_KEY=dev-only-account-pseudonym-key-change-me \
            backend > prod-start.log 2>&1
          status=$?
          set -e
          tail -n 20 prod-start.log
          test "$status" -ne 0
          grep -q "Refusing to start with profile(s) \[prod\]" prod-start.log

      - name: Compose logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ha.yml logs --no-color --tail=300

      - name: Scan images (Trivy, fixable CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forgedmediadetection-backend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forgedmediadetection-frontend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: forgedmediadetection-ml-service:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          timeout: 15m0s

      - name: SBOM (CycloneDX) per image
        uses: anchore/sbom-action@v0
        with:
          image: forgedmediadetection-backend:latest
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@v0
        with:
          image: forgedmediadetection-frontend:latest
          format: cyclonedx-json
          output-file: sbom-frontend.cdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@v0
        with:
          image: forgedmediadetection-ml-service:latest
          format: cyclonedx-json
          output-file: sbom-ml-service.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.cdx.json

      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ha.yml down -v
