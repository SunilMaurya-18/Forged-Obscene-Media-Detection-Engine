# Scrapes the compose stack. Backends are discovered by DNS so the second instance from
# docker-compose.ha.yml is picked up when it exists (a missing name yields no target, not a DOWN one).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [backend, backend-2]
        type: A
        port: 8090
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance

  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8000"]
        labels:
          instance: ml-service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
