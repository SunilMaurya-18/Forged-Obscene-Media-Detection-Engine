# All @SpringBootTest runs use the test profile so ProductionSecretsGuard does not fire.
spring.profiles.active=test
# application.yml leaves these empty for production; tests need fixed local seeds.
investigation.pseudonym-key=dev-only-account-pseudonym-key-change-me
report.signing.allow-file-keys=true
app.security.moderator-username=moderator
app.security.moderator-password=moderator
app.security.moderator-role=MODERATOR
# Shared second reviewers / seniors / investigators used across integration tests.
# Tests that need a different roster override app.security.extra-moderators explicitly.
app.security.extra-moderators=reviewer:reviewer:MODERATOR:core,senior:senior:SENIOR_MODERATOR:core,senior2:senior2:SENIOR_MODERATOR:core,investigator:investigator:INVESTIGATOR:legal,investigator2:investigator2:INVESTIGATOR:legal
