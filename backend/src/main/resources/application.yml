server:
  port: 8080
  servlet:
    session:
      cookie:
        # CSRF tokens are off (the console authenticates every call with Basic auth); a strict cookie
        # means a cross-site request never carries the moderator's session
        same-site: strict
        http-only: true

spring:
  application:
    name: forged-media
  # ProductionSecretsGuard refuses weak secrets outside the test profile
  profiles:
    default: prod
  main:
    web-application-type: servlet
  # Phase 24: only used when app.state.store=redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
  servlet:
    multipart:
      # Phase 23: videos up to 50 MB (the ML service's own cap)
      max-file-size: 50MB
      max-request-size: 51MB
      # Hold every accepted upload in memory: Tomcat otherwise spools multipart files to a temp dir,
      # and media bytes must never touch disk
      file-size-threshold: 52MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forged_media}
    username: ${SPRING_DATASOURCE_USERNAME:forged}
    password: ${SPRING_DATASOURCE_PASSWORD:forged}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # Compose turns this on together with STATE_STORE=redis (MANAGEMENT_HEALTH_REDIS_ENABLED=true)
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    # Phase 24: per call; a hung ml-service fails the request instead of holding a servlet thread
    timeout: ${ML_SERVICE_TIMEOUT:PT60S}

decision:
  forgery-auto-flag: 0.85
  explicit-auto-flag: 0.85
  forgery-review: 0.50
  explicit-review: 0.50

# Phase 13: IT Rules 2026 takedown windows (ISO-8601 durations)
compliance:
  sla:
    user-complaint: ${COMPLIANCE_SLA_USER_COMPLAINT:PT2H}
    government-order: ${COMPLIANCE_SLA_GOVERNMENT_ORDER:PT3H}
    at-risk-threshold: ${COMPLIANCE_SLA_AT_RISK:PT30M}
    check-interval: ${COMPLIANCE_SLA_CHECK_INTERVAL:PT15S}
  escalation:
    webhook-url: ${COMPLIANCE_ESCALATION_WEBHOOK_URL:}
  # Phase 19: jurisdiction applied when a complaint doesn't name one (platform config; never geo-IP)
  default-jurisdiction: ${COMPLIANCE_DEFAULT_JURISDICTION:IN}
  # Seeded GENERIC rules (fallback for any jurisdiction without its own rule). Edit the DB row afterwards.
  generic-user-complaint-hours: ${COMPLIANCE_GENERIC_USER_COMPLAINT_HOURS:24}
  generic-government-order-hours: ${COMPLIANCE_GENERIC_GOVERNMENT_ORDER_HOURS:24}
  # Phase 23: appeal decision window (GENERIC APPEAL rule; per-jurisdiction rows override it)
  generic-appeal-hours: ${COMPLIANCE_GENERIC_APPEAL_HOURS:72}

# Phase 23: video is sampled at N fps; each score is routed on one aggregate of its per-frame scores
video:
  fps: ${VIDEO_FPS:1.0}
  top-k: ${VIDEO_TOP_K:3}
  forgery-aggregate: ${VIDEO_FORGERY_AGGREGATE:TOPK_MEAN}
  explicit-aggregate: ${VIDEO_EXPLICIT_AGGREGATE:MAX}

# Phase 23: moderator wellbeing. Items acted on or revealed per session before a break is enforced.
wellbeing:
  exposure-limit: ${WELLBEING_EXPOSURE_LIMIT:40}
  break-duration: ${WELLBEING_BREAK_DURATION:PT15M}
  idle-reset: ${WELLBEING_IDLE_RESET:PT2H}
  support-url: ${WELLBEING_SUPPORT_URL:/support}

# Phase 23: public transparency report. Counts below min-cell (and rates over so few items) are withheld.
transparency:
  min-cell: ${TRANSPARENCY_MIN_CELL:5}
  cache-ttl: ${TRANSPARENCY_CACHE_TTL:PT60S}

# Phase 15: evidentiary reports show timestamps in UTC plus this zone
report:
  local-zone: ${REPORT_LOCAL_ZONE:Asia/Kolkata}
  signing:
    # Phase 24: file = dev keyring in key-dir (generated on first start); vault = HashiCorp Vault Transit (KMS)
    provider: ${REPORT_SIGNING_PROVIDER:file}
    key-dir: ${REPORT_SIGNING_KEY_DIR:./data/signing-keys}
    # Outside the dev profile the file provider is refused unless this is true
    allow-file-keys: ${REPORT_SIGNING_ALLOW_FILE_KEYS:false}
    vault:
      address: ${VAULT_ADDR:}
      token: ${VAULT_TOKEN:}
      namespace: ${VAULT_NAMESPACE:}
      mount: ${VAULT_TRANSIT_MOUNT:transit}
      key-name: ${VAULT_TRANSIT_KEY:fmd-report-signing}
  # Phase 24: RFC 3161 Time-Stamping Authority for signed reports (blank = no timestamps)
  timestamp:
    url: ${REPORT_TSA_URL:}
    timeout: ${REPORT_TSA_TIMEOUT:PT10S}
    # PEM bundle of TSA certificates (or their issuers) to report as trusted; blank = none trusted
    trusted-certs: ${REPORT_TSA_TRUSTED_CERTS:}

# Phase 18: on-device hash pre-screening ("check before you post")
prescreen:
  phash-max-distance: ${PRESCREEN_PHASH_MAX_DISTANCE:8}
  pdq-max-distance: ${PRESCREEN_PDQ_MAX_DISTANCE:31}
  # Optional known-hash seeds (hex pHashes), comma-separated. Empty in production.
  seed-hashes: ${PRESCREEN_SEED_HASHES:}

# Phase 26: partner account IDs are stored only as HMAC-SHA256(key, platform + account).
# Changing the key unlinks every existing pseudonym.
investigation:
  pseudonym-key: ${INVESTIGATION_PSEUDONYM_KEY:}
  # Phase 28: evidence packages for investigators under an approved legal request
  handover:
    download-window: ${HANDOVER_DOWNLOAD_WINDOW:PT24H}
    max-request-term: ${HANDOVER_MAX_REQUEST_TERM:P180D}

# Phase 21: self-service reports (case number + PIN, no account)
complaints:
  max-pin-attempts: ${COMPLAINTS_MAX_PIN_ATTEMPTS:5}
  lockout: ${COMPLAINTS_PIN_LOCKOUT:PT15M}
  # Optional: JSON POST on every case status change, for an email/SMS gateway (blank = log only)
  notify-webhook-url: ${COMPLAINTS_NOTIFY_WEBHOOK_URL:}

# Third-party API (/api/v1). Requests per minute per key, by plan.
api:
  rate-limits:
    FREE: ${API_RATE_LIMIT_FREE:10}
    PRO: ${API_RATE_LIMIT_PRO:60}
    ENTERPRISE: ${API_RATE_LIMIT_ENTERPRISE:600}
  # Test profile only: seeds a FREE bootstrap client. Leave empty in production.
  bootstrap-key: ${API_BOOTSTRAP_KEY:}

app:
  state:
    store: ${STATE_STORE:memory}
  security:
    moderator-username: ${MODERATOR_USERNAME:}
    moderator-password: ${MODERATOR_PASSWORD:}
    # Primary account role. ADMIN opens /admin and can manage staff.
    moderator-role: ${MODERATOR_ROLE:ADMIN}
    # Extra accounts, "username:password:ROLE:team". Prefer creating staff from /admin.
    extra-moderators: ${MODERATOR_EXTRA_ACCOUNTS:}
