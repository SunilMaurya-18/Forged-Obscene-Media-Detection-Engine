# Hosted public demo (Phase 25): synthetic samples only, visitor reset, automatic reset every
# DEMO_RESET_INTERVAL, HTTPS via Caddy. Run it on its own VM and database, never next to real data.
#   DEMO_DOMAIN=demo.example.org docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
# DNS: point DEMO_DOMAIN and feed.DEMO_DOMAIN at the VM. Only Caddy publishes ports (80/443).
# See docs/PUBLIC_DEMO.md.

services:
  backend:
    ports: !reset []
    environment:
      # Demo mode is refused outside the dev profile, which is what keeps it off production deployments
      SPRING_PROFILES_ACTIVE: dev
      DEMO_ENABLED: "true"
      DEMO_PUBLIC: "true"
      COMPLIANCE_SEED_DEMO: "true"
      # No published partner API key on the internet; visitors can still create their own keys (wiped on reset)
      API_DEMO_KEY: ""
      BACKEND_LOG_FORMAT: ecs

  frontend:
    ports: !reset []

  mock-social-feed:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set DEMO_DOMAIN to the public host name, e.g. demo.example.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      mock-social-feed:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
